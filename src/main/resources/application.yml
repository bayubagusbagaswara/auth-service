spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:mysql://localhost:3306/auth_service_db
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      pool-name: AuthServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    baseline-version: 1

server:
  port: 8081


app:
  jwt:
    issuer: http://localhost:8081
    key-id: auth-rsa-1
    private-key: jwt-keys/private.pem
    public-key: jwt-keys/public.pem
    access-token-expiration: 15m
    refresh-token-expiration: 7d
    audience:
      - auth-service
      - billing-service
      - core-service
      - hiport-service
